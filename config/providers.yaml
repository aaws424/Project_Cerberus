# LLM providers. All of them speak the OpenAI chat-completions format, so cerberus/llm.py
# needs only a base URL, a key and a model name. Free-tier limits change often: check your console.
# Model names are starting choices from the design brief; confirm them in each provider's docs.

# Which providers each job tries, in order. The first available one is used; on a 429 / 5xx
# error the call backs off, retries, then moves on to the next provider in the list.
jobs:
  understand:    [groq, gemini, openrouter, ollama]
  draft:         [gemini, groq, openrouter, ollama]
  manual_answer: [gemini, groq, openrouter, ollama]
  generate:      [mistral, gemini, groq]

providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY
    models:
      default: llama-3.3-70b-versatile
      understand: openai/gpt-oss-120b
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    key_env: GEMINI_API_KEY
    models:
      default: gemini-flash-lite-latest
  openrouter:
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    models:
      default: meta-llama/llama-3.3-70b-instruct:free
  mistral:
    base_url: https://api.mistral.ai/v1
    key_env: MISTRAL_API_KEY
    models:
      default: mistral-small-latest
  ollama:
    base_url: http://localhost:11434/v1
    key_env: null            # local; available when the Ollama server is running
    models:
      default: qwen2.5:7b
