# Reply templates in Iraqi Arabic. The pipeline fills {slots} from extracted facts only.
# [[...]] marks something the agent must fill in before approving.
# In LLM mode the model may reword a filled template, and the validator then checks the result.

parts:
  amount: " بمبلغ {amount} {currency}"
  date: " بتاريخ {day}/{month}"
  ref: " رقم {ref}"
  receipt: " (رقم الوصل {ref})"
  agent: " ({agent})"
  phone: " {phone}"

currency_words: {IQD: دينار, USD: دولار}

categories:
  failed_transfer:
    with_ref: "هلا بيك. وصلتنا رسالتك عن الحوالة{ref}{amount}{date}. حولناها لفريق المدفوعات حتى يتابعوها، وراح نرجعلك بالنتيجة خلال [[المدة]]. آسفين على التأخير."
    without_ref: "هلا بيك. حتى نكدر نتابع حوالتك{amount}{date}، دزلنا رقم العملية رجاءً. تلكاه بالتطبيق من (سجل الحركات). أول ما يوصلنا نحولها لفريق المدفوعات."
  wrong_recipient:
    with_ref: "هلا بيك. فهمنا إن الحوالة{ref}{amount} راحت لرقم غلط. فتحنا طلب مراجعة ويا فريق النزاعات وراح نبلغك بالنتيجة خلال [[المدة]]. لحد ذاك، لا تحول للرقم مرة ثانية ولا تشارك معلوماتك ويا أحد."
    without_ref: "هلا بيك. حتى نفتح طلب مراجعة للحوالة اللي راحت بالغلط{amount}، دزلنا رقم العملية والرقم اللي حولت عليه. تلكاهم بالتطبيق من (سجل الحركات)."
  agent_dispute:
    any: "هلا بيك، وآسفين على اللي صار ويا الوكيل{agent}. سجلنا شكوتك{amount}{date} وحولناها لفريق شبكة الوكلاء حتى يراجعون العملية ويا الوكيل، وراح نرجعلك خلال [[المدة]]. إذا عندك وصل أو صورة من العملية دزها إلنا."
  card_issue:
    any: "هلا بيك. وصلتنا مشكلتك ويا البطاقة{amount}{date}، وفريق البطاقات راح يراجعها ويرجعلك خلال [[المدة]]. للأمان، لا تشارك رقم البطاقة الكامل أو الرمز السري ويا أي أحد."
  bill_payment:
    any: "هلا بيك. راجعنا دفعة الفاتورة{amount}{date}{receipt} وحولناها لفريق المدفوعات حتى يتأكدون منها ويا الجهة. راح نبلغك بالنتيجة خلال [[المدة]]."
  login_problem:
    any: "هلا بيك، وآسفين على الإزعاج. جرّب تحدّث التطبيق لآخر نسخة وتسجل دخول مرة ثانية. إذا بقت المشكلة، فريق أمن الحسابات راح يراجع حسابك ويتواصل وياك خلال [[المدة]]. لا تشارك رمزك السري أو رمز التحقق ويا أي أحد."
  otp_not_received:
    any: "هلا بيك. تأكد إن الخط{phone} شغال وبيه تغطية، وإنه نفس الرقم المسجل بالحساب، وانتظر دقيقتين قبل ما تطلب رمز جديد. إذا بعده ما يوصل، فريق أمن الحسابات راح يتابع ويرجعلك خلال [[المدة]]."
  balance_or_fee:
    any: "هلا بيك. راجعنا استفسارك عن الرصيد{amount}: [[سبب الحركة أو العمولة من كشف الحساب]]. تكدر تشوف كل الحركات من (سجل الحركات) بالتطبيق، وإذا تحتاج توضيح أكثر احنا حاضرين."
  kyc_verification:
    any: "هلا بيك. طلب توثيق حسابك وصلنا وفريق الامتثال يراجعه. إذا طلعت الصورة غير واضحة، صوّر الهوية بضوء زين وبدون انعكاس وارفعها مرة ثانية. راح نبلغك بالنتيجة خلال [[المدة]]."

how_to: "هلا بيك. هاي الخطوات حسب دليل التطبيق ({section_id} · {title}):\n{steps}\nإذا واجهتك أي مشكلة بالخطوات، احنا حاضرين."
