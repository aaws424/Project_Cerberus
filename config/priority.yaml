# Priority score. The LLM (or the rules) extract facts; this file turns facts into points.
# Every ticket shows its breakdown, so a team lead can see *why* it is P1 and change the weights here.

usd_to_iqd: 1310           # fixed rate, used only to compare amounts; not a market rate

amount_points:             # first matching row wins (amount converted to IQD)
  - {min: 5000000, points: 30}
  - {min: 1000000, points: 20}
  - {min: 250000, points: 10}
  - {min: 1, points: 5}

money_stuck_points:        # hours between the incident and the ticket; only categories with money_at_stake
  - {min_hours: 72, points: 15}
  - {min_hours: 24, points: 10}

still_reversible:          # a wrong-recipient transfer reported quickly can often still be reversed
  categories: [wrong_recipient]
  max_hours: 24
  points: 15

flag_points:
  fraud: 40
  human_requested: 10
  repeat_contact: 10
  legal_or_abuse: 5

force_p1_flags: [fraud]    # fraud or account takeover is always P1, whatever the points

waiting:                   # old tickets rise so nothing starves
  points_per_hour: 1
  max_points: 15

bands:                     # score >= P1 -> P1, >= P2 -> P2, otherwise P3
  P1: 60
  P2: 35
