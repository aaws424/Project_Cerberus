injection_patterns:
  - 'ignore\s+(?:all\s+)?(?:the\s+|your\s+|any\s+)?(?:previous\s+|prior\s+|above\s+|earlier\s+)?(?:instructions|rules|prompts?|messages?)'
  - 'disregard\s+(?:all\s+)?(?:the\s+|your\s+)?(?:previous\s+|prior\s+|above\s+)?(?:instructions|rules)'
  - 'you\s+are\s+now\b'
  - '\bact\s+as\s+(?:an?\s+|the\s+)?(?:admin|administrator|agent|system|supervisor|manager)'
  - 'pretend\s+(?:to\s+be|you\s+are)'
  - 'system\s*prompt'
  - '(?:^|[\s.>])system\s*:'
  - '<\s*/?\s*(?:system|assistant|instructions?|ticket[\w-]*)\s*>'
  - '\[/?inst\]'
  - '(?:mark|set|flag|record)\s+(?:this\s+|it\s+|the\s+|my\s+)?(?:ticket\s+|transfer\s+|case\s+)?(?:as\s+)?(?:refunded|resolved|approved|closed|completed|p1)\b'
  - 'approve\s+(?:the\s+|my\s+|a\s+)?refund'
  - 'classify\s+(?:this|it|the\s+ticket)\s+as'
  - '(?:reveal|print|show|repeat)\s+(?:me\s+)?(?:your|the)\s+(?:system\s+)?(?:prompt|instructions)'
  - 'reply\s+with\s+(?:this|the\s+following)'
  - 'تجاهل\s+(?:كل\s+)?(?:ال)?(?:تعليمات|اوامر|قواعد)'
  - 'انسى?\s+(?:كل\s+)?(?:ال)?(?:تعليمات|اوامر|قواعد)'
  - 'انت\s+(?:هسه|الان|من\s+هسه)\s+(?:ال)?(?:مدير|ادمن|مشرف|موظف)'
  - '(?:سجل|اعتبر)(?:ها|ه)?\s+(?:ال)?(?:حواله\s+|عمليه\s+|طلب\s+)?(?:مسترجعه|مكتمله|منتهيه|مرجعه|مدفوعه)'
  - 'اكتب\s+(?:ب|في\s+)?(?:ال)?رد\b'
  - '(?:اعطيني|اعطني|طلعلي|ورني)\s+(?:ال)?(?:تعليمات|برومبت)'
  - 'tjahal\s+el?\s*ta3limat'

kurdish_letters: "ڕڵێۆە"
arabizi_words: ["ma", "wasal", "mablagh", "akhi", "shlon", "sar", "ayam", "alf", "arid", "hisab", "kashf", "mahad", "yrid", "shako", "hwaya", "zain", "7awalt"]
