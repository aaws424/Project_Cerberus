# Step 1 (guard): pure-Python checks that run before any LLM call.
# Phrases are written naturally and folded at load time (أ→ا, ة→ه, گ→ك, چ→ج ...).
# Injection patterns are regular expressions applied to the folded, lower-cased text.

max_chars: 2000

