    base_points: 10
    money_at_stake: false
    description: Questions about the balance, a deduction, a fee or commission that the customer does not understand.
    keywords:
      "رصيدي": 2.0
      "الرصيد": 1.5
      "انقص": 1.5
      "نقص": 1.0
      "عمولة": 2.0
      "رسوم": 2.0
      "استقطاع": 2.0
      "انخصم": 1.0
      "شكد": 1.0
      "fee": 2.0
      "balance": 2.0
      "charge": 1.5

  kyc_verification:
    ar: توثيق الحساب
    en: KYC verification
    team: compliance
    base_points: 10
    money_at_stake: false
    description: Identity verification (KYC) is pending, rejected, or the ID photo upload fails.
    keywords:
      "توثيق": 3.0
      "توثق": 3.0
      "الهوية": 2.0
      "البطاقة الوطنية": 3.0
      "جواز": 2.0
      "سيلفي": 2.0
      "الصورة غير واضحة": 2.5
      "ارفع": 0.5
      "kyc": 3.0
      "selfie": 2.0
