  unclear:
    ar: غير واضح
    en: Unclear
    team: supervisor
    base_points: 0
    money_at_stake: false
    description: Not enough information to tell what the issue is.
    keywords: {}

# A "how do I" cue with no complaint words is very likely a how-to question.
how_to_boost:
  points: 2.5
  cues: ["شلون", "كيف", "how do i", "how to", "how can i", "shlon"]
  complaint_cues: ["ما وصل", "انخصم", "انسحب", "خطا", "ما يشتغل", "ما دا", "مقفول", "غلط", "مشكلة",
                   "ما اكدر", "ما يوصل", "نصب", "سرق", "ارجع", "ترجعولي",
                   "not working", "didn't", "doesn't", "can't", "wrong", "blocked"]
