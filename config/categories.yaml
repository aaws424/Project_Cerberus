  how_to_question:
    ar: سؤال شلون أسوي
    en: How-to question
    team: tier1
    base_points: 5
    money_at_stake: false
    description: A "how do I ..." question about using the app, with no problem reported. Answered from the app manual.
    keywords:
      "شلون": 2.0
      "كيف": 2.0
      "شنو الطريقة": 2.5
      "اريد اعرف": 1.5
      "هل اكدر": 1.5
